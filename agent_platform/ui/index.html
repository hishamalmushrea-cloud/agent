<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>وكيل الكمبيوتر المستقل — Windows Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar (conversations) -->
    <aside class="sidebar">
      <button class="btn primary new-chat" id="newChat">+ محادثة جديدة</button>

      <div class="sidebar-section">
        <div class="sidebar-label">المحادثات</div>
        <div id="convList" class="conv-list">
          <div class="conv-empty">لا توجد محادثات بعد.</div>
        </div>
      </div>

      <div class="sidebar-status">
        <div class="status-row"><span class="dot ok"></span> العقل: <b id="brainLabel">—</b></div>
        <div class="status-row"><span class="dot ok"></span> الأدوات: <b id="toolCount">—</b></div>
        <div class="status-row"><span class="dot" id="connDot"></span> الاتصال: <b id="conn">offline</b></div>
      </div>
    </aside>

    <!-- Main chat -->
    <main class="main">
      <div class="chat" id="chat">
        <div class="chat-empty" id="chatEmpty">
          <div class="empty-title">👋 أهلًا بك</div>
          <p>اكتب هدفًا طبيعيًا، وسأخطّط وأنفّذ على جهازك أمامك — خطوة بخطوة، معًا.</p>
          <div class="suggestions" id="suggestions">
            <button class="sug" data-g="أنشئ مشروع Python، ثبّت المتطلبات، شغّل الكود وأصلح أي خطأ">أنشئ مشروع Python وشغّله</button>
            <button class="sug" data-g="افتح Chrome وابحث عن كذا ثم نزّل الملف وأعد تسميته وضعه في مجلد">تصفّح ونزّل ملف </button>
            <button class="sug" data-g="رتّب ملفات PDF داخل مجلدات وأعد تسميتها">رتّب ملفات PDF</button>
            <button class="sug" data-g="ابحث في الملفات عن ما يخص موضوع معين">ابحث في الملفات</button>
          </div>
        </div>
        <div id="chatThread" class="chat-thread hidden"></div>
      </div>

      <div class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="اكتب رسالتك… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
          <button class="btn primary" id="send">إرسال ➤</button>
        </div>
        <div class="composer-meta">
          <span id="brainMeta">—</span>
          <span class="approval-hint">الحذف/الأوامر الخطرة تتطلب موافقتك</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
