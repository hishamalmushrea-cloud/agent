[project]
name = "agent_platform"
version = "0.1.0"
description = "Windows Autonomous Computer Agent — an extensible agent platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.0",
  "httpx>=0.27",
  "mcp<2",
  "pywebview>=5.0",
]

[project.optional-dependencies]
windows = ["pywinauto>=0.6.8", "pywin32>=306", "pyautogui>=0.9.54"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_platform*"]
